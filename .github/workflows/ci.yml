name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu images (ubuntu-latest is 26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
